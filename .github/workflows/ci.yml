name: reproduce
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Dataset, lexical controls, tests, smoke run, provenance
        run: make reproduce
      - name: Fail if the controlled dataset or controls drift
        run: git diff --exit-code -- data/prompts_v3.jsonl results/lexical_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: results/ }
